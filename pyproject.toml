[project]
name = "saes"
version = "1.5.0"
description = "Python library designed to analyze and compare the performance of different algorithms across multiple problems using non-parametric statistical tests"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    {name = "Antonio J. Nebro", email = "ajnebro@uma.es"},
    {name = "Emilio Rodrigo Carreira Villalta", email = "emiliorodrigo.ecr@gmail.com"}
]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.9.2",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
    "rich>=13.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs>=2.0",
    "ipykernel>=6.0",
    "nbconvert>=7.17.1",
    "python-dotenv>=1.2.2",
]

# ── Build System ─────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saes"]

# ── uv ───────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs>=2.0",
    "ipykernel>=6.0",
    "nbconvert>=7.17.1",
    "python-dotenv>=1.2.2",
]

# ── Ruff ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["saes"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── Mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "scipy.*",
    "pandas.*",
    "seaborn.*",
    "statsmodels.*",
    "rich.*",
]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-q"]
markers = [
    "slow: marks tests as slow",
]
